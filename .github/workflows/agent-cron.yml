name: Zenlot Content Agent

# Safety switch: these agents run in dry-run mode (no posts, replies or emails) until the
# repository variable AGENTS_LIVE is "true". Instagram has its own switch (IG_LIVE).
# Even when live, held drafts are emailed once a day (15:00 UTC, best 5, original post quoted).
# Replies are never posted automatically. Original posts auto-post only if AGENTS_AUTOPOST is
# also "true" and they pass the brand check.

on:
  schedule:
    # Pain Point Hunter — every 12 hours
    - cron: '0 */12 * * *'
    # Content Creator — every 3 days at 14:00 UTC
    - cron: '0 14 */3 * *'
    # Community Engager — daily at 10:00 UTC (peak forex Twitter activity)
    - cron: '0 10 * * *'
    # Reddit Community — daily at 13:00 UTC (midday US East, peak Reddit activity)
    - cron: '0 13 * * *'
    # Daily digest — the best 5 held X/Reddit drafts, emailed at 15:00 UTC
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Which job to run manually?'
        required: true
        default: 'hunter'
        type: choice
        options:
          - hunter
          - creator
          - engager
          - reddit
          - digest

defaults:
  run:
    working-directory: .

permissions:
  contents: write # commit the draft queue (content/outbox) between runs

concurrency:
  group: agents # runs share the draft queue; never write it at the same time
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      # ── Shared env block used by all steps ─────────────────────────────────
      # Each step declares only the vars it needs. LLM chain: ANTHROPIC_API_KEY is primary,
      # OPENAI_API_KEY is the first fallback, XAI_API_KEY (Grok) the second.

      - name: Run Pain Point Hunter
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '0 */12 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'hunter')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ vars.AGENTS_LIVE == 'true' && 'false' || 'true' }}
          AGENTS_AUTOPOST: ${{ vars.AGENTS_AUTOPOST }}
        run: npm run run:hunter

      - name: Run Content Creator
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '0 14 */3 * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'creator')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ vars.AGENTS_LIVE == 'true' && 'false' || 'true' }}
          AGENTS_AUTOPOST: ${{ vars.AGENTS_AUTOPOST }}
        run: npm run run:creator

      - name: Run Community Engager
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'engager')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TWITTER_APP_KEY: ${{ secrets.TWITTER_APP_KEY }}
          TWITTER_APP_SECRET: ${{ secrets.TWITTER_APP_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ vars.AGENTS_LIVE == 'true' && 'false' || 'true' }}
          AGENTS_AUTOPOST: ${{ vars.AGENTS_AUTOPOST }}
        run: npm run run:engager

      - name: Run Reddit Community
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'reddit')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ vars.AGENTS_LIVE == 'true' && 'false' || 'true' }}
          AGENTS_AUTOPOST: ${{ vars.AGENTS_AUTOPOST }}
        run: npm run run:reddit

      - name: Send daily draft digest
        if: |
          (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'digest')
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ vars.AGENTS_LIVE == 'true' && 'false' || 'true' }}
        run: npm run run:digest

      # Live runs keep held drafts in content/outbox/queue.json until the daily digest.
      - name: Commit draft queue
        if: always() && vars.AGENTS_LIVE == 'true'
        run: |
          git config user.name "zenlot-content-agent"
          git config user.email "actions@users.noreply.github.com"
          git add content/outbox 2>/dev/null || true
          if git diff --cached --quiet; then echo "No queue changes"; exit 0; fi
          git commit -m "chore(outbox): update draft queue $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
